x-coverage:
  state: covered
  reason: institution_operated_surfaces_verified
  generated: '2026-08-19'
  method: probed
  detail: >-
    Nine institution-operated surfaces and two vendor tenancies were settled by live
    probe on 2026-08-19, with no vendor contract saved under Caltech's slug. Caltech is
    an outlier in this cohort: its research surfaces really are its own, self-hosted on
    caltech.edu, rather than a Figshare or Pure tenancy misread as institutional. Real
    absences confirmed, not assumed: no central developer portal (api.caltech.edu and
    developer.caltech.edu both fail DNS resolution), no Caltech-published OpenAPI for any
    surface, no llms.txt (404), no .well-known/security.txt (404), no status page, no
    published deprecation policy or changelog, no OAuth authorization server, no
    documented scope vocabulary, and no machine-readable course-catalog interface behind
    catalog.caltech.edu. Seven of the twelve education-regime domain standards were
    probed and not found (scim, lti, oneroster, ed-fi, caliper, qti, crossref); five were
    confirmed inside live contracts (shibboleth, saml, oai-pmh, datacite, orcid). Two
    partial blocks encountered and recorded as findings rather than gaps: scedc.caltech.edu
    documentation pages return 403 to non-browser clients while the data services return
    200, and www.caltech.edu/about/news returns 403 while its Atom feed returns 200.
    CaltechAUTHORS returned intermittent 522 between successful calls.
  evidence:
    - url: https://data.caltech.edu/api/records?size=1
      status: 200
    - url: https://data.caltech.edu/oai2d?verb=Identify
      status: 200
