  description: >-
    Caltech Library's OpenURL link resolver is an EBSCO tenancy — instance `l7ubco` on the shared host
    resolver.ebsco.com — referenced from Caltech's own library pages. Recorded as a relationship only
    — no EBSCO contract is saved under this institution. No baseURL is emitted: the resolver returns 404/400
    to requests without OpenURL parameters, so the endpoint could not be confirmed by a clean 200 and
    a dead pointer would read as a claim. Confidence medium — the instance is evidenced only from Caltech's
    own markup.
  humanURL: https://library.caltech.edu/search
