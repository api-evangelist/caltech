aid: caltech
name: California Institute of Technology
x-type: university
x-category: Private Research University
description: >-
  The California Institute of Technology (Caltech) is a private research university in
  Pasadena, California, and one of the rare institutions in this cohort whose
  machine-readable footprint is genuinely its own rather than a vendor's contract running
  under its name. Caltech operates no central developer portal — neither api.caltech.edu
  nor developer.caltech.edu resolves — and publishes no OpenAPI, no llms.txt, no
  .well-known catalog and no status page. What it does operate is real research
  infrastructure on its own domain, engineered by four independent units with no shared
  convention between them: Caltech Library runs CaltechDATA and CaltechAUTHORS on
  self-hosted InvenioRDM, with public REST APIs, OAI-PMH 2.0 endpoints and DataCite DOIs
  minted under Caltech's own 10.22002 prefix; the Seismological Laboratory runs the
  Southern California Earthquake Data Center's FDSN web services; Caltech/IPAC runs three
  NASA archives — IRSA, NED and the NASA Exoplanet Archive — behind IVOA Virtual
  Observatory interfaces; and IMSS runs a Shibboleth identity provider registered in the
  InCommon federation. Five of the twelve education-regime domain standards are evidenced
  directly inside live Caltech contracts: shibboleth, saml, oai-pmh, datacite and orcid.
  The library discovery layer is the one genuinely outsourced surface, a Springshare
  tenancy at libguides.caltech.edu. The honest summary is that Caltech ships excellent
  open research data and almost no API product management around it.
